{% extends "thil_base.html" %}{% block body %}<h1>User management</h1><div class="card"><h2>Add user</h2><form method="post" action="/THIL/admin/users"><input type="hidden" name="csrf" value="{{ csrf_token }}"><div class="row"><input name="username" placeholder="Username" required><input type="password" name="password" placeholder="Temporary password (12+ characters)" required size="32"><label><input type="checkbox" name="can_mhra"> MHRA</label><label><input type="checkbox" name="can_pid"> PID</label><label><input type="checkbox" name="is_admin"> Administrator</label><button>Add user</button></div></form></div><div class="card" style="margin-top:20px"><h2>Existing users</h2>{% for u in users %}<form method="post" action="/THIL/admin/users/{{ u.id }}/update" style="border-top:1px solid #e5eaf0;padding:14px 0"><input type="hidden" name="csrf" value="{{ csrf_token }}"><strong>{{ u.username }}</strong><div class="row"><label><input type="checkbox" name="can_mhra" {% if u.can_mhra %}checked{% endif %}> MHRA</label><label><input type="checkbox" name="can_pid" {% if u.can_pid %}checked{% endif %}> PID</label><label><input type="checkbox" name="is_admin" {% if u.is_admin %}checked{% endif %}> Admin</label><label><input type="checkbox" name="active" {% if u.active %}checked{% endif %}> Active</label><input type="password" name="password" placeholder="New password (optional)"><button>Save</button></div></form>{% endfor %}</div>{% endblock %}
