<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}THIL Portal{% endblock %}</title><style>
body{margin:0;background:#f3f6fa;color:#172033;font:15px system-ui,Arial}.top{background:#102a43;color:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}.top a{color:white}.wrap{max-width:1000px;margin:38px auto;padding:0 20px}.card{background:white;border:1px solid #d9e2ec;border-radius:12px;padding:24px;box-shadow:0 5px 20px #102a4310}input{padding:10px;border:1px solid #bcccdc;border-radius:7px}button,.button{background:#1769aa;color:white;border:0;border-radius:7px;padding:10px 15px;text-decoration:none;cursor:pointer}.danger{background:#a61b1b}.muted{color:#627d98}.flash{padding:10px;border-radius:7px;margin-bottom:15px;background:#fff0f0}.ok{background:#e8f7ee}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.app{display:block;color:inherit;text-decoration:none}.app h2{margin-top:0}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #e5eaf0;padding:10px 6px}label{display:block;margin:8px 0}.inline{display:inline}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
</style></head><body><header class="top"><strong>THIL Portal</strong>{% if me %}<span>{{ me.username }} · {% if me.is_admin %}<a href="/THIL/admin">Admin</a> · {% endif %}<form class="inline" method="post" action="/THIL/logout"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button>Log out</button></form></span>{% endif %}</header><main class="wrap">{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% block body %}{% endblock %}</main></body></html>
