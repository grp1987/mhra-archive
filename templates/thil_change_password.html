{% extends "thil_base.html" %}{% block title %}Change password{% endblock %}{% block body %}<div class="card" style="max-width:420px;margin:60px auto"><h1>Choose a new password</h1><p class="muted">You must replace your temporary password before opening the applications. Use at least {{ minimum }} characters.</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>New password<br><input type="password" name="password" minlength="{{ minimum }}" autocomplete="new-password" required style="width:100%"></label><label>Confirm new password<br><input type="password" name="confirm" minlength="{{ minimum }}" autocomplete="new-password" required style="width:100%"></label><button style="width:100%;margin-top:12px">Change password and continue</button></form></div>{% endblock %}
